<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="dashboard">
    <div class="panel">
        <h3>Translation (X, Y, Z)</h3>
        <div id="joystick-zone" class="joystick-container"></div>
        
        <div class="slider-container">
            <span class="fader-label">Z-Height (Up/Down)</span>
            <div id="nipple-z" class="nipple-zone-horizontal"></div>
            <span id="val-z" class="fader-val" style="display:block;">0.00</span>
        </div>
    </div>

    <div class="panel video-zone">
        <h3>Main Camera</h3>
        <video autoplay playsinline muted></video>
        <div id="connection-status" class="status-text">Connecting to Robot...</div>
    </div>

    <div class="panel">
        <h3>Head Orientation</h3>
        <div class="arm-faders" style="justify-content: center; gap: 40px;">
            <div class="fader-track">
                <span class="fader-label">Pitch</span>
                <div id="nipple-pitch" class="nipple-zone"></div>
                <span id="val-pitch" class="fader-val">0.00</span>
            </div>
            <div class="fader-track">
                <span class="fader-label">Roll</span>
                <div id="nipple-roll" class="nipple-zone"></div>
                <span id="val-roll" class="fader-val">0.00</span>
            </div>
        </div>
        <div class="utility-zone" style="margin-top: 30px; text-align: center;">
    <button class="btn btn-estop" id="btn-estop" style="background: red; color: white;">EMERGENCY STOP</button>
    <button class="btn btn-preset" id="btn-reset" style="background: #ffc107; color: black; margin-left: 10px;">Clear Error / Reset</button>
</div>
    </div>
</div>		
    <script src="/rtcbot.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
